<script>
'use strict';
// Apresentação de Pedro Sequeira, edição 2026.
const EMBEDDED_SLIDES = null;
const EMBEDDED_HERO = null;
const heroImage = () => EMBEDDED_HERO || "assets/hero.jpg";
const slideImage = n => EMBEDDED_SLIDES?.[n-1] || `assets/slide-${String(n).padStart(2,'0')}.jpg`;
const slides = [
 {k:'ABERTURA',title:'A utilidade da IA no treino desportivo',lead:'O que já é possível. E até onde poderá ir.',insight:'A IA apoia o treino e a investigação — mas não substitui a observação, a interpretação e a decisão humana.'},
 {k:'O PONTO DE PARTIDA',title:'A IA não substitui o olhar. Amplia-o.',lead:'Da recolha de informação ao apoio à decisão.',insight:'Mais dados não garantem melhores decisões. Melhor interpretação, sim.'},
 {k:'O QUE JÁ É POSSÍVEL',title:'A IA já trabalha em seis frentes.',lead:'Aplicações concretas, com níveis de maturidade diferentes.',insight:'O valor não está na ferramenta. Está no problema que resolve.'},
 {k:'ANÁLISE TÉCNICA',title:'Ver melhor. Corrigir com critério.',lead:'O vídeo torna-se uma fonte estruturada de informação.',insight:'Captar → Analisar → Intervir. O feedback precisa de ser validado no treino.'},
 {k:'MONITORIZAÇÃO',title:'Um atleta não é uma média.',lead:'Dados diferentes. Respostas diferentes.',insight:'A relação entre carga externa, esforço percebido e bem-estar é um sinal para investigar — nunca um diagnóstico automático.'},
 {k:'TÁTICA',title:'O jogo tem padrões. A equipa tem contexto.',lead:'A IA ajuda a encontrar sequências. O treinador transforma-as em ideias.',insight:'Detetar → Discutir → Treinar. A análise ganha valor quando melhora a intervenção.'},

try{const s=JSON.parse(localStorage.getItem('ia-treino-progress')||'{}');if(s.slide>=1&&s.slide<=13)state.slide=s.slide;}catch(_e){}
const $=id=>document.getElementById(id);

let toastTimeout;

function setView(view,opts={}){if(!['home','slides','tools','practice','quiz'].includes(view))return;state.view=view;if(opts.slide)state.slide=Math.max(1,Math.min(13,opts.slide));render();document.querySelectorAll('[data-view]').forEach(b=>{const active=b.dataset.view===state.view;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(!opts.keepScroll)window.scrollTo({top:0,behavior:'instant'});}
function navigateSlide(n){state.slide=Math.max(1,Math.min(slides.length,n));state.step=0;saveProgress();setView('slides',{keepScroll:true});const section=document.querySelector('.slide-image-shell');section?.scrollIntoView({block:'start',behavior:'smooth'});}
function render(){const app=$('app');if(state.view==='home')app.innerHTML=renderHome();if(state.view==='slides')app.innerHTML=renderSlides();if(state.view==='tools')app.innerHTML=renderTools();if(state.view==='practice'){app.innerHTML=renderPractice();updatePrompt();}if(state.view==='quiz')app.innerHTML=renderQuiz();}
function renderHome(){return `<section class="view"><div class="hero"><div class="hero-image" style="background-image:url('${heroImage()}')"></div><div class="hero-content"><div class="kicker">Uma apresentação para explorar</div><h1>A utilidade da <span class="accent">IA</span> no treino desportivo.</h1><p>O que já é possível. E até onde poderá ir.</p><div class="hero-signature">Pedro Sequeira · Treinadores × Investigadores</div><div class="btn-row"><button class="btn primary" data-action="start">Explorar os 13 slides <span aria-hidden="true">→</span></button><button class="btn ghost" data-view="practice">Experimentar um prompt</button></div></div></div><div class="metrics"><div class="metric"><strong>13</strong><span>slides originais</span></div><div class="metric"><strong>12</strong><span>ferramentas</span></div><div class="metric"><strong>6</strong><span>perguntas</span></div></div><div class="section-head"><div><p class="kicker">Percurso interativo</p><h2>Da ideia à <span class="accent">prática.</span></h2><p>Consulta os slides, experimenta cenários e testa o que aprendeste.</p></div></div><div class="card-grid"><div class="feature-card"><span class="glyph">▣</span><h3>Explorar a apresentação</h3><p>13 etapas com os slides originais e explicações adaptadas ao ecrã do telemóvel.</p><button class="btn small" data-view="slides">Ver slides →</button></div><div class="feature-card"><span class="glyph">◈</span><h3>Descobrir ferramentas</h3><p>Assistentes, vídeo, monitorização e pesquisa científica, com exemplos de utilização.</p><button class="btn small" data-view="tools">Ver ferramentas →</button></div><div class="feature-card"><span class="glyph">✦</span><h3>Aplicar e avaliar</h3><p>Cria um prompt útil para o teu contexto e responde a um desafio de seis perguntas.</p><button class="btn small" data-view="quiz">Fazer o desafio →</button></div></div><div class="quote">“A IA não substitui o olhar. <span class="accent">Amplia-o.</span>”</div><div class="notice">Aplicação function renderSlides(){const s=slides[state.slide-1];return `<section class="view"><div class="page-head"><div><p class="kicker">${escapeHtml(s.k)}</p><h1>${escapeHtml(s.title)}</h1><p>${escapeHtml(s.lead)}</p></div><div class="number-bubble">${String(state.slide).padStart(2,'0')}</div></div><div class="progress-line" aria-label="Progresso: slide ${state.slide} de 13"><span style="width:${Math.round(state.slide/13*100)}%"></span></div><div class="slides-meta"><span>APRESENTAÇÃO ORIGINAL</span><span>${String(state.slide).padStart(2,'0')} / 13</span></div><div class="slide-image-shell" aria-label="Imagem do slide ${state.slide}; desliza para navegar"><img loading="eager" src="${slideImage(state.slide)}" alt="Slide ${state.slide}: ${escapeHtml(s.title)}"><button class="expand-btn" data-action="zoom">Ampliar ↗</button></div><div class="slide-controls"><button class="btn small" data-action="prev" ${state.slide===1?'disabled':''}>← Anterior</button><span class="count">${state.slide} / 13</span><button class="btn small" data-action="next" ${state.slide===13?'disabled':''}>Seguinte →</button></div><div class="chapter-strip" aria-label="Escolher slide">${slides.map((x,i)=>`<button class="chapter-chip ${i+1===state.slide?'selected':''}" data-slide="${i+1}" title="${escapeHtml(x.k)}" aria-label="Ir para slide ${i+1}: ${escapeHtml(x.k)}">${i+1}</button>`).join('')}</div><div class="insight"><span class="minilabel">Ideia-chave</span><h3>${escapeHtml(s.title)}</h3><p>${escapeHtml(s.insight)}</p></div>${renderActivity(state.slide)}<p class="activity-note">Os slides podem ser ampliados. Arrasta a imagem para a esquerda ou para a direita para mudar de slide.</p></section>`}
function pickButtons(items,layout='step-grid'){return `<div class="${layout}">${items.map((x,i)=>`<button class="${layout==='tile-grid'?'tile':'step'} ${state.step===i?'selected':''}" data-action="step" data-index="${i}"><b>${String(i+1).padStart(2,'0')}</b>${escapeHtml(x[0])}</button>`).join('')}</div><div class="activity-response"><strong>${escapeHtml(items[state.step][0])}</strong><div>${escapeHtml(items[state.step][1])}</div></div>`}
function renderActivity(n){const head=(name,sub='TOCA PARA EXPLORAR')=>`<div class="activity-header"><h3>${name}</h3><span class="minilabel">${sub}</span></div>`;let html='';

 case 5:html=`${head('Simulador de interpretação','CENÁRIO FICTÍCIO')}<div class="slider-row"><label for="gps">Carga externa (escala ilustrativa)</label><input id="gps" type="range" min="1" max="10" value="${state.gps}" data-range="gps"><output class="value-tag" id="gps-val">${state.gps}</output></div><div class="slider-row"><label for="rpe">RPE percebido (1–10)</label><input id="rpe" type="range" min="1" max="10" value="${state.rpe}" data-range="rpe"><output class="value-tag" id="rpe-val">${state.rpe}</output></div><div class="activity-response"><strong>Leitura do cenário</strong><div id="load-feedback">${getLoadFeedback()}</div></div><p class="activity-note">Exemplo didático: os dois valores não são diretamente comparáveis. Não calcula fadiga nem risco de lesão.</p>`;break;
 case 6:html=`${head('Da sequência à intervenção')}<div id="pitch" class="fake-pitch stage-${state.step}"><span class="pitch-half"></span><span class="pitch-circle"></span><span class="ball"></span><span class="player p1"></span><span class="player p2"></span><span class="player p3"></span></div>${pickButtons([['DETETAR','Identificar uma sequência observável no vídeo.'],['DISCUTIR','Interpretar a sequência à luz da estratégia e do adversário.'],['TREINAR','Converter a análise em tarefa de treino.']],'tile-grid')}<p class="activity-note">Esquema de jogo ilustrativo, não corresponde a uma equipa real.</p>`;break;

 case 9:html=`${head('Que ferramenta usar?')}<p>Uma ferramenta de vídeo não é automaticamente IA. Uma resposta plausível não é automaticamente evidência.</p><button class="btn primary small" data-view="tools">Abrir a caixa de ferramentas →</button>`;break;
 case 10:html=`${head('Constrói a tua instrução')}<p>Objetivo + dados + limites + formato. Quanto mais explícito o contexto, mais útil é o rascunho produzido.</p><button class="btn primary small" data-view="practice">Abrir laboratório de prompts →</button>`;break;
 case 11:html=head('O futuro: três possibilidades')+pickButtons(futureAreas,'tile-grid')+'<p class="activity-note">Cenários prospetivos. A disponibilidade e a eficácia não estão garantidas.</p>';break;

 }return `<div class="activity">${html}</div>`;}
function getLoadFeedback(){const gap=state.rpe-state.gps;if(gap>=3)return 'Esforço percebido relativamente elevado face ao índice ilustrativo de carga externa. Vale a pena explorar contexto, sono e bem-estar.';if(gap<=-3)return 'Carga externa ilustrativa superior ao RPE. Pode justificar uma conversa sobre perceção de esforço e características da sessão.';return 'Os valores ilustrativos estão relativamente próximos. Mesmo assim, a leitura depende da história e do contexto do atleta.';}
function renderTools(){const filters=[['todos','Todas'],['treino','Treino e gestão'],['video','Vídeo e análise'],['investigacao','Investigação']];const shown=toolList.filter(t=>state.filter==='todos'||t.group===state.filter);return `<section class="view"><div class="page-head"><div><p class="kicker">Da ferramenta ao problema</p><h1>Caixa de <span class="accent">ferramentas.</span></h1><p>Algumas soluções são sistemas de IA. Outras são ferramentas digitais complementares.</p></div><div class="number-bubble">◈</div></div><div class="filter-row" role="group" aria-label="Filtrar ferramentas">${filters.map(f=>`<button class="segment ${f[0]===state.filter?'selected':''}" data-filter="${f[0]}">${f[1]}</button>`).join('')}</div><div class="tool-grid">${shown.map(t=>`<article class="tool-card"><div class="tool-top"><span class="tool-tag">${escapeHtml(t.type)}</span><span class="glyph" aria-hidden="true">↗</span></div><h3>${escapeHtml(t.name)}</h3><p>${escapeHtml(t.description)}</p><a class="external" target="_blank" rel="noopener noreferrer" href="${escapeHtml(t.url)}">Abrir site oficial ↗</a></article>`).join('')}</div><div class="notice">As funcionalidades, os preços e as condições de acesso podem mudar. Confirma cada ferramenta e protege os dados dos atletas antes de a utilizar.</div><div class="btn-row"><button class="btn small" data-action="jump" data-index="9">Ver slide 9 →</button><button class="btn small" data-view="practice">Criar um prompt →</button></div></section>`}
function createPrompt(){const role=state.role==='treinador'?'um treinador desportivo':'um investigador em ciências do desporto';const topicMap={planeamento:'planeamento e adaptação de sessões',tecnica:'análise técnica por vídeo',carga:'monitorização e interpretação de carga',tatica:'análise tática',investigacao:'pesquisa e síntese de evidência científica'};const output=state.role==='treinador'?'Apresenta duas propostas alternativas, em passos claros, com objetivos, duração, materiais, justificações e formas de avaliação.':'Organiza uma resposta com questão de investigação, abordagem metodológica, quadro comparativo e limitações. Distingue claramente informação confirmada de hipóteses.';
return `Atua como assistente de apoio a ${role}. Não substituis o juízo profissional.\n\nTAREFA\nAjuda-me com: ${topicMap[state.promptTopic]}.\n\nCONTEXTO\n${state.promptContext.trim()||'[Descrever atletas, modalidade, objetivos e calendário.]'}\n\nDADOS DISPONÍVEIS\n${state.promptData.trim()||'[Indicar dados e fontes disponíveis.]'}\n\nLIMITES E CUIDADOS\n${state.promptLimits.trim()||'[Indicar restrições, privacidade e segurança.]'}\n\nFORMATO DA RESPOSTA\n${output}\n\nAntes de responder, identifica o que não sabes. Explicita pressupostos, incertezas e riscos de interpretação. Não inventes dados, referências ou diagnósticos. Recomenda a verificação humana das conclusões.`}
function renderPractice(){return `<section class="view"><div class="page-head"><div><p class="kicker">Ferramenta interativa</p><h1>Laboratório de <span class="accent">prompts.</span></h1><p>Transforma uma ideia vaga numa instrução com objetivo, contexto, dados e limites.</p></div><div class="number-bubble">✦</div></div><div class="card"><div class="form-grid"><div class="form-field"><label for="role">PERFIL</label><select id="role" data-field="role"><option value="treinador" ${state.role==='treinador'?'selected':''}>Treinador</option><option value="investigador" ${state.role==='investigador'?'selected':''}>Investigador</option></select></div><div class="form-field"><label for="topic">OBJETIVO</label><select id="topic" data-field="promptTopic"><option value="planeamento" ${state.promptTopic==='planeamento'?'selected':''}>Planeamento</option><option value="tecnica" ${state.promptTopic==='tecnica'?'selected':''}>Análise técnica</option><option value="carga" ${state.promptTopic==='carga'?'selected':''}>Monitorização da carga</option><option value="tatica" ${state.promptTopic==='tatica'?'selected':''}>Análise tática</option><option value="investigacao" ${state.promptTopic==='investigacao'?'selected':''}>Investigação</option></select></div><div class="form-field full"><label for="context">CONTEXTO</label><textarea id="context" data-field="promptContext" placeholder="Modalidade, escalão, objetivos, calendário...">${escapeHtml(state.promptContext)}</textarea></div><div class="form-field full"><label for="data">DADOS DISPONÍVEIS</label><textarea id="data" data-field="promptData" placeholder="RPE, vídeo, estudos científicos, indicadores...">${escapeHtml(state.promptData)}</textarea></div><div class="form-field full"><label for="limits">LIMITES E CUIDADOS</label><textarea id="limits" data-field="promptLimits" placeholder="O que deve evitar? Quais os riscos?">${escapeHtml(state.promptLimits)}</textarea></div></div></div><div class="section-head"><div><h2>O teu <span class="accent">prompt.</span></h2><p>Podes copiar para o assistente de IA que utilizas, depois de o reveres.</p></div></div><div class="prompt-output" id="prompt-output" aria-live="polite"></div><div class="btn-row" style="margin-top:15px"><button class="btn primary" data-action="copy-prompt">Copiar prompt ↗</button><button class="btn" data-action="save-prompt">Guardar .txt ↓</button><button class="btn ghost" data-action="prompt-reset">Repor exemplo</button></div><div class="notice">Não introduzas dados pessoais ou de saúde identificáveis de atletas sem base legal, autorização e salvaguardas apropriadas. O prompt é gerado localmente no teu dispositivo.</div></section>`}
function updatePrompt(){const el=$('prompt-output');if(el)el.textContent=createPrompt()}
function renderQuiz(){const i=state.quizIndex; if(i>=quiz.length){return `<section class="view"><p class="kicker">Desafio concluído</p><div class="quiz-card quiz-finish"><span class="glyph">◎</span><h1>O essencial ficou contigo.</h1><div class="quiz-score">${state.quizScore}<small> / ${quiz.length}</small></div><p>${state.quizScore>=5?'Excelente compreensão dos princípios. Continua a testar tudo no terreno.':state.quizScore>=3?'Bom ponto de partida. Revê os slides relacionados com as respostas.':'Volta aos slides: cada resposta nasce de uma ideia da apresentação.'}</p><div class="btn-row" style="justify-content:center"><button class="btn primary" data-action="quiz-reset">Refazer desafio ↻</button><button class="btn" data-view="slides">Rever os slides</button></div></div></section>`;}const item=quiz[i];const answered=state.quizAnswer!==null;return `<section class="view"><div class="page-head"><div><p class="kicker">Desafio de conhecimentos</p><h1>O que retiveste?</h1><p>Seis perguntas baseadas diretamente na apresentação.</p></div><div class="number-bubble">◎</div></div><div class="progress-line"><span style="width:${Math.round((i+Number(answered))/quiz.length*100)}%"></span></div><div class="quiz-card"><div class="minilabel">PERGUNTA ${i+1} DE ${quiz.length}</div><h2 class="quiz-q">${escapeHtml(item.q)}</h2><div class="answer-grid">${item.a.map((a,j)=>`<button class="answer ${answered?(j===item.correct?'correct':j===state.quizAnswer?'incorrect':''):''}" data-quiz-answer="${j}" ${answered?'disabled':''}>${escapeHtml(a)}</button>`).join('')}</div>${answered?`<div class="feedback"><strong>${state.quizAnswer===item.correct?'Correto!':'A resposta certa é a opção destacada.'}</strong><div>${escapeHtml(item.why)}</div></div><div class="btn-row" style="margin-top:17px"><button class="btn primary" data-action="quiz-next">${i===quiz.length-1?'Ver resultado':'Próxima pergunta →'}</button></div>`:''}</div><p class="activity-note">Este desafio é formativo e não recolhe dados pessoais.</p></section>`;}
function showAbout(){const over=$('overlay');over.className='overlay';over.setAttribute('aria-hidden','false');over.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="btn small close-overlay" data-action="close-overlay">Fechar ✕</button><p class="kicker">Sobre</p><h2 id="modal-title">IA no Treino Desportivo</h2><p>Aplicação interativa baseada nos 13 slides da apresentação <b>“A utilidade da IA no Treino Desportivo: o que já é possível e até onde poderá ir”</b>, de <b>Pedro Sequeira</b> (2026).</p><div class="label-line"><span>Conteúdo</span><span>13 slides + experiências + quiz</span></div><div class="label-line"><span>Dados</span><span>O teu prompt não é enviado</span></div><div class="label-line"><span>Internet</span><span>Necessária apenas para sites externos</span></div><p class="activity-note">A versão HTML portátil funciona sem ligação à Internet. Para instalar como app no ecrã inicial, publica a pasta PWA num site HTTPS; depois usa “Adicionar ao ecrã principal” no navegador.</p></div>`}
function showZoom(){const over=$('overlay');over.className='overlay image-open';over.setAttribute('aria-hidden','false');over.innerHTML=`<button class="btn small close-overlay" data-action="close-overlay">Fechar ✕</button><img class="modal-image" src="${slideImage(state.slide)}" alt="Slide ${state.slide} ampliado">`;}
function hideOverlay(){const over=$('overlay');over.className='overlay hidden';over.setAttribute('aria-hidden','true');over.innerHTML=''}
async function copyToClipboard(text){try{await navigator.clipboard.writeText(text);toast('Prompt copiado!')}catch(_){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const done=document.execCommand('copy');ta.remove();toast(done?'Prompt copiado!':'Copia o texto manualmente.')}}
function downloadPrompt(){const blob=new Blob([createPrompt()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='prompt_ia_treino_pedro_sequeira.txt';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Ficheiro de texto preparado.')}
function resetPrompt(){state.role='treinador';state.promptTopic='planeamento';state.promptContext='Equipa sub-19; cinco sessões de 60 minutos; jogo ao sábado.';state.promptData='RPE de treino, disponibilidade e objetivos da semana.';state.promptLimits='Evitar recomendações clínicas; identificar pressupostos e dados em falta.';render();}
function doStep(idx){state.step=Math.max(0,idx);const a=document.querySelector('.activity');if(!a)return;const temp=document.createElement('div');temp.innerHTML=renderActivity(state.slide);a.replaceWith(temp.firstElementChild);}
document.addEventListener('click',e=>{const el=e.target.closest('[data-view],[data-action],[data-slide],[data-filter],[data-quiz-answer]');if(!el)return;if(el.dataset.view){setView(el.dataset.view);return;}if(el.dataset.slide){navigateSlide(Number(el.dataset.slide));return;}if(el.dataset.filter){state.filter=el.dataset.filter;render();return;}if(el.dataset.quizAnswer!==undefined){if(state.quizAnswer!==null)return;state.quizAnswer=Number(el.dataset.quizAnswer);if(state.quizAnswer===quiz[state.quizIndex].correct)state.quizScore++;render();return;}const a=el.dataset.action;switch(a){case 'home':setView('home');break;case 'about':showAbout();break;case 'close-overlay':hideOverlay();break;case 'start':navigateSlide(1);break;case 'prev':navigateSlide(state.slide-1);break;case 'next':navigateSlide(state.slide+1);break;case 'step':doStep(Number(el.dataset.index));break;case 'zoom':showZoom();break;case 'jump':navigateSlide(Number(el.dataset.index));break;case 'restart':navigateSlide(1);break;case 'copy-prompt':copyToClipboard(createPrompt());break;case 'save-prompt':downloadPrompt();break;case 'prompt-reset':resetPrompt();break;case 'quiz-next':state.quizIndex++;state.quizAnswer=null;render();window.scrollTo({top:0,behavior:'instant'});break;case 'quiz-reset':state.quizIndex=0;state.quizAnswer=null;state.quizScore=0;render();break;}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.range){state[el.dataset.range]=Number(el.value);const valueEl=$(el.dataset.range+'-val');if(valueEl)valueEl.textContent=el.value;const fb=$('load-feedback');if(fb)fb.textContent=getLoadFeedback();}if(el.dataset.field){state[el.dataset.field]=el.value;updatePrompt();}});
document.addEventListener('change',e=>{if(e.target.dataset.field){state[e.target.dataset.field]=e.target.value;updatePrompt();}});
let touchX=0,touchY=0;
document.addEventListener('touchstart',e=>{if(e.target.closest('.slide-image-shell')){touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY;}else touchX=0;},{passive:true});
document.addEventListener('touchend',e=>{if(state.view!=='slides'||!touchX)return;const dx=e.changedTouches[0].screenX-touchX,dy=e.changedTouches[0].screenY-touchY;touchX=0;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.3)navigateSlide(state.slide+(dx<0?1:-1));},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideOverlay();return;}if(state.view==='slides'&&!document.querySelector('.overlay:not(.hidden)')){if(e.key==='ArrowRight')navigateSlide(state.slide+1);if(e.key==='ArrowLeft')navigateSlide(state.slide-1);}});
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))hideOverlay()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
render();

</script>
</body>
</html>
